<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvice Salud</title>

    <style>
        input {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border-radius: 8px;
    border: 1px solid #ccc;
}

input:focus {
    outline: none;
    border-color: #10b981;
    box-shadow: 0 0 5px rgba(16,185,129,0.5);
}
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
        }

        nav {
            background: #1f2937;
            color: white;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        button {
            background: #10b981;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #059669;
        }

        .logout-btn {
            background: #ef4444;
        }

        .logout-btn:hover {
            background: #dc2626;
        }

        .estado {
            padding: 8px;
            margin: 5px 0;
            border-radius: 10px;
            color: black;
            font-weight: bold;
        }

        .estado.ok { background: #d1fae5; }
        .estado.cansado { background: #fef9c3; }
        .estado.dolor { background: #fee2e2; }
        .estado.critico { background: #fecaca; }

    </style>
    
</head>

<body>

    <nav>
        🩺 Jarvice Salud

        Usuario actual: {{ user.username }} <br>
¿Autenticado?: {{ user.is_authenticated }}

{% if user.is_authenticated %}

<form method="post" action="{% url 'logout' %}">
    {% csrf_token %}
    <button class="logout-btn" type="submit">
        Cerrar sesión
    </button>
</form>

{% else %}

<p>No hay usuario autenticado</p>

{% endif %}
    <div class="container">

    {% block content %}
    {% endblock %}

</div>

</div>
    </div>

</body>
</html>
