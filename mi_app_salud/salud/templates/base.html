<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvice Salud</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
        }

        nav {
            background: #1f2937;
            color: white;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        button {
            background: #10b981;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #059669;
        }

        /* 🟢 ESTADOS (AQUÍ SÍ VA BIEN) */

        .estado {
            padding: 8px;
            margin: 5px 0;
            border-radius: 10px;
            color: black;
            font-weight: bold;
        }

        .estado.ok {
            background: #d1fae5;
        }

        .estado.cansado {
            background: #fef9c3;
        }

        .estado.dolor {
            background: #fee2e2;
        }

        .estado.critico {
            background: #fecaca;
        }

    </style>
</head>

<body>

    <nav>🩺 Jarvice Salud</nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
