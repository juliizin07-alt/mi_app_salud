<!-- SIGNOS VITALES JARVICE -->

<div class="dashboard">

    <!-- NEWS2 -->
    <div class="minicard">

        <div class="icono">🧠</div>

        <div class="dato" id="scoreIA">
            0
        </div>

        <div class="label">
            NEWS2 IA
        </div>

    </div>


    <!-- PULSO -->
    <div class="minicard">

        <div class="icono">❤️</div>

        <div
            class="dato"
            id="pulso"
            data-valor="{% if ultimo_signo_vital %}{{ ultimo_signo_vital.frecuencia_cardiaca|default:'' }}{% endif %}"
        >
            Sin datos
        </div>

        <div class="label">
            Pulso
        </div>

    </div>


    <!-- TEMPERATURA -->
    <div class="minicard">

        <div class="icono">🌡️</div>

        <div
            class="dato"
            id="temp"
            data-valor="{% if ultimo_signo_vital %}{{ ultimo_signo_vital.temperatura|default:'' }}{% endif %}"
        >
            Sin datos
        </div>

        <div class="label">
            Temperatura
        </div>

    </div>


    <!-- OXÍGENO -->
    <div class="minicard">

        <div class="icono">🫁</div>

        <div
            class="dato"
            id="oxi"
            data-valor="{% if ultimo_signo_vital %}{{ ultimo_signo_vital.saturacion_oxigeno|default:'' }}{% endif %}"
        >
            Sin datos
        </div>

        <div class="label">
            Oxígeno
        </div>

    </div>


    <!-- RESPIRACIÓN -->
    <div class="minicard">

        <div class="icono">🌬️</div>

        <div
            class="dato"
            id="resp"
            data-valor=""
        >
            Sin datos
        </div>

        <div class="label">
            Respiración
        </div>

    </div>


    <!-- PRESIÓN -->
    <div class="minicard">

        <div class="icono">🩺</div>

        <div
            class="dato"
            id="presion"
            data-valor="{% if ultimo_signo_vital %}{{ ultimo_signo_vital.presion_arterial|default:'' }}{% endif %}"
        >
            Sin datos
        </div>

        <div class="label">
            Presión
        </div>

    </div>


    <!-- GPS -->
    <div class="minicard">

        <div class="icono">📍</div>

        <div class="dato">
            No conectado
        </div>

        <div class="label">
            GPS
        </div>

    </div>


    <!-- IA CLÍNICA -->
    <div class="minicard">

        <div class="icono">🤖</div>

        <div class="dato" id="iaEstado">
            ESTABLE
        </div>

        <div class="label">
            IA Clínica
        </div>

    </div>

</div>
