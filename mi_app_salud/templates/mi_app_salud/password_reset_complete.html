
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contraseña actualizada | Jarvice</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;

            background:
                radial-gradient(
                    circle at top,
                    #102b3d 0%,
                    #07121c 42%,
                    #03070b 100%
                );

            font-family: Arial, Helvetica, sans-serif;
            color: #eaf6ff;
        }

        .card {
            width: 100%;
            max-width: 500px;

            padding: 42px 36px;

            text-align: center;

            background: rgba(11, 22, 33, 0.96);

            border: 1px solid #183447;
            border-radius: 20px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.45),
                0 0 30px rgba(0, 143, 209, 0.08);
        }

        .logo {
            width: 70px;
            height: 70px;

            margin: 0 auto 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 20px;

            background: #102b3d;
            border: 1px solid #1b83b8;

            font-size: 34px;

            box-shadow:
                0 0 25px rgba(22, 169, 237, 0.15);
        }

        .brand {
            margin-bottom: 5px;

            color: #ffffff;

            font-size: 23px;
            font-weight: bold;

            letter-spacing: 5px;
        }

        .subtitle {
            margin-bottom: 30px;

            color: #59c7ff;

            font-size: 11px;

            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .success-icon {
            width: 64px;
            height: 64px;

            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: rgba(38, 190, 130, 0.10);
            border: 1px solid rgba(38, 190, 130, 0.45);

            font-size: 30px;
        }

        h1 {
            margin: 0 0 18px;

            color: #ffffff;

            font-size: 27px;
            line-height: 1.3;
        }

        .message {
            margin: 0 0 28px;

            color: #91a9b9;

            font-size: 14px;
            line-height: 1.8;
        }

        .success-box {
            margin-bottom: 28px;

            padding: 16px;

            background: #0d202d;

            border: 1px solid #173c50;
            border-radius: 12px;

            color: #b9d5e3;

            font-size: 13px;
            line-height: 1.7;
        }

        .button {
            display: inline-block;

            padding: 14px 30px;

            background: #008fd1;

            border: 1px solid #16a9ed;
            border-radius: 10px;

            color: #ffffff;

            font-size: 14px;
            font-weight: bold;

            text-decoration: none;

            transition: 0.2s ease;

            box-shadow:
                0 8px 25px rgba(0, 143, 209, 0.20);
        }

        .button:hover {
            background: #009fe8;
            transform: translateY(-1px);
        }

        .footer {
            margin-top: 30px;
            padding-top: 22px;

            border-top: 1px solid #183447;

            color: #5f7481;

            font-size: 11px;
            line-height: 1.6;
        }

        .footer strong {
            color: #9edfff;
        }

        @media (max-width: 520px) {

            body {
                padding: 16px;
            }

            .card {
                padding: 34px 24px;
            }

            h1 {
                font-size: 24px;
            }

            .brand {
                font-size: 20px;
            }

        }
    </style>

</head>

<body>

    <main class="card">

        <div class="logo">
        🤖
        </div>

        <div class="brand">
            JARVICE
        </div>

        <div class="subtitle">
            HEALTH AI
        </div>

        <div class="success-icon">
            &#10003;
        </div>

        <h1>
            Contraseña actualizada
        </h1>

        <p class="message">
        Tu contraseña fue cambiada correctamente.
        </p>

        <div class="success-box">
        🔐 Tu cuenta está lista.
        <br>
        Ya podés ingresar nuevamente a Jarvice con tu nueva contraseña.
        </div>

        <a
        href="{% url 'login' %}"
        class="button"
        >
        🚀 Ingresar a Jarvice
        </a>

        <div class="footer">
            <strong>JARVICE HEALTH AI</strong>
            <br>
            Sistema inteligente de monitoreo y asistencia en salud.
        </div>

    </main>

</body>

</html>
