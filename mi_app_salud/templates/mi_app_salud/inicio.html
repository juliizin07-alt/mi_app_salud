<script>
const canvas = document.getElementById("ecg");
const ctx = canvas.getContext("2d");

canvas.width = canvas.offsetWidth;
canvas.height = canvas.offsetHeight;

let offset = 0;
let pulsoECG = 78;
let colorECG = "#00ff9d";

function grid() {
    ctx.strokeStyle = "rgba(0,255,150,0.08)";
    ctx.lineWidth = 1;

    for(let x=0; x<canvas.width; x+=20){
        ctx.beginPath();
        ctx.moveTo(x,0);
        ctx.lineTo(x,canvas.height);
        ctx.stroke();
    }

    for(let y=0; y<canvas.height; y+=20){
        ctx.beginPath();
        ctx.moveTo(0,y);
        ctx.lineTo(canvas.width,y);
        ctx.stroke();
    }
}

function onda(x, base){

    let ciclo = (x + offset) % 140;

    if(ciclo < 15) return base;
    if(ciclo < 25) return base - 8;
    if(ciclo < 35) return base;
    if(ciclo < 42) return base + 12;
    if(ciclo < 46) return base - 42;
    if(ciclo < 50) return base + 18;
    if(ciclo < 65) return base;
    if(ciclo < 90) return base - Math.sin(ciclo*0.2)*10;

    return base;
}

function drawECG(){

    ctx.fillStyle = "#071019";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    grid();

    let base = canvas.height / 2;

    ctx.beginPath();
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = colorECG;
    ctx.shadowBlur = 14;
    ctx.shadowColor = colorECG;

    for(let x=0; x<canvas.width; x++){
        let y = onda(x, base);
        if(x===0){
            ctx.moveTo(x,y);
        }else{
            ctx.lineTo(x,y);
        }
    }

    ctx.stroke();

    offset += pulsoECG / 18;

    requestAnimationFrame(drawECG);
}

drawECG();
</script>

<script>
const canvas = document.getElementById("ecg");
const ctx = canvas.getContext("2d");

canvas.width = canvas.offsetWidth;
canvas.height = canvas.offsetHeight;

let x = 0;

function ecgWave(xPos, baseY){

    if (xPos % 120 < 10) return baseY - 8;
    if (xPos % 120 === 20) return baseY - 35;
    if (xPos % 120 === 22) return baseY + 25;

    if (xPos % 120 > 60 && xPos % 120 < 80)
        return baseY + Math.sin(xPos * 0.1) * 10;

    return baseY;
}

function drawECG(){

    ctx.fillStyle = "#050b12";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = "#00ff9d";
    ctx.lineWidth = 2;
    ctx.beginPath();

    let baseY = canvas.height / 2;

    for(let i=0;i<canvas.width;i++){
        let y = ecgWave(x + i, baseY);
        ctx.lineTo(i, y);
    }

    ctx.stroke();

    x++;
    requestAnimationFrame(drawECG);
}

drawECG();
</script>
